:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --ink:#18202E; --ink2:#4B5567; --line:#D6DAE3; --soft:#E8EAF0;
  --mast:#18202E; --mast-ink:#F4F6FA;
  --gold:#E3A800; --gold-ink:#2B2100;
  --fb:"Carlito","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --fh:"Poppins","Segoe UI","Helvetica Neue",Arial,sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0F131B; --surface:#192031; --ink:#EEF1F6; --ink2:#A7B0C2; --line:#2B3548; --soft:#222B3D;
         --mast:#0A0D13; --mast-ink:#F4F6FA; }
}
body.print{ --bg:#fff; --surface:#fff; --ink:#18202E; --ink2:#4B5567; --line:#C9CED9; --soft:#E8EAF0; color-scheme: light; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 var(--fb);}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #4C8DFF;outline-offset:2px}
h1,h2,h3,p{margin:0}

/* ---------- topo ---------- */
.mast{background:var(--mast);color:var(--mast-ink);padding:22px clamp(16px,4vw,40px) 0}
.mast-in{max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;gap:18px 40px;align-items:flex-end;justify-content:space-between}
.mast h1{font:700 clamp(22px,3.2vw,34px)/1.1 var(--fh);letter-spacing:-.01em}
.mast p{color:#B9C2D3;margin-top:6px;font-size:17px}
.days{display:flex;gap:10px}
.day{border:0;background:transparent;color:var(--mast-ink);display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;
  padding:10px 20px 12px;border-radius:14px 14px 0 0;opacity:.7}
.day .num{grid-row:1/3;font:700 clamp(42px,6vw,64px)/.9 var(--fh)}
.day .wd{font-weight:700;font-size:18px;align-self:end}
.day .cnt{font-size:14px;color:#B9C2D3;align-self:start}
.day[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1}
.day[aria-selected="true"] .cnt{color:var(--ink2)}
.day:hover{opacity:1}

/* ---------- controles ---------- */
.wrap{max-width:1500px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:16px 0 8px}
.views{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.views button{border:0;background:transparent;padding:7px 18px;font-weight:700}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{flex:1 1 240px;max-width:420px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit}
.status{color:var(--ink2);font-size:15px;margin-left:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 4px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 8px;font-size:15px;font-weight:700}
.chip .sw{width:14px;height:14px;border-radius:4px;background:var(--c);flex:none}
.chip small{font-weight:400;color:var(--ink2);font-size:13px}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 22%,var(--surface));border-color:var(--c)}
.clear{border:0;background:transparent;text-decoration:underline;color:var(--ink2);padding:4px 8px}
.key{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--ink2);font-size:14.5px;padding:6px 0 12px;align-items:center}
.key span{display:inline-flex;align-items:center;gap:7px}
.k-bar{width:5px;height:16px;border-radius:2px;background:var(--ink2)}
.k-dot{width:8px;height:8px;border-radius:50%;background:var(--ink2)}
.k-gold{width:16px;height:16px;border-radius:4px;background:var(--gold)}
.k-hatch{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--soft) 0 4px,transparent 4px 8px)}

.strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:var(--gold);color:var(--gold-ink);border-radius:12px;padding:10px 16px;margin:2px 0 14px;border:0;width:100%;text-align:left}
.strip b{font-family:var(--fh);font-size:17px}
.strip svg{width:20px;height:20px;flex:none}

/* ---------- grade ---------- */
.gwrap{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:auto;max-height:calc(100vh - 150px);margin-bottom:40px}
.g{display:grid;grid-template-columns:var(--axw,50px) repeat(6,minmax(var(--colmin,210px),1fr));min-width:min-content}
.gh{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:2px solid var(--ink);padding:10px 10px 8px;font-weight:700;font-size:15px;line-height:1.15;display:flex;gap:8px;align-items:flex-start;min-height:var(--hdr,56px)}
.gh .rn{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:700 12px var(--fh)}
.gh.corner{left:0;z-index:7}
.ga{position:sticky;left:0;z-index:4;background:var(--surface);border-right:1px solid var(--line)}
.ga .hr{position:absolute;right:6px;transform:translateY(-50%);font:500 12px var(--fh);color:var(--ink2);background:var(--surface);padding:0 2px}
.ga .hr.aw{background:var(--gold);color:var(--gold-ink);border-radius:4px;padding:1px 3px;font-weight:700;font-size:11px;right:3px}
.gc{position:relative;border-left:1px solid var(--line);
  background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:100% var(--hh);background-position:0 var(--off)}
.awl{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--gold);z-index:1}
.card{position:absolute;left:4px;right:4px;z-index:2;text-align:left;border:0;border-left:5px solid var(--c);border-radius:6px;
  padding:4px 8px 4px 7px;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--ink);
  display:flex;flex-direction:column;gap:1px;overflow:hidden;box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 25%,transparent)}
.card:hover{background:color-mix(in srgb,var(--c) 26%,var(--surface))}
.card .meta{display:flex;justify-content:space-between;gap:6px;font-size:12px;line-height:14px;flex:none}
.card .meta b{font-family:var(--fh);font-weight:500;font-size:11.5px;white-space:nowrap}
.card .meta em{font-style:normal;font-weight:700;color:color-mix(in srgb,var(--c) 70%,var(--ink));white-space:nowrap}
.card .ttl{font-weight:700;font-size:13.5px;line-height:1.17;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--tl,3);overflow:hidden;flex:none}
.card .ppl{font-size:12px;line-height:1.2;color:var(--ink2);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--pl,2);overflow:hidden;min-height:0}
.card.noppl .ppl{display:none}
.card .dots{position:absolute;right:5px;bottom:4px;display:flex;gap:3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px var(--surface)}
.card.dim{opacity:.22}
.card.rel{opacity:.8;border-left-style:dashed}
.card.award{background:var(--gold);border-left-color:var(--gold-ink);color:var(--gold-ink);box-shadow:none}
.card.award .meta b,.card.award .meta em{color:var(--gold-ink)}
.card.award .ppl{color:#4F3D00}
.card.port{background:repeating-linear-gradient(0deg,color-mix(in srgb,var(--c) 9%,var(--surface)) 0 22px,color-mix(in srgb,var(--c) 14%,var(--surface)) 22px 44px)}
.lunch{position:absolute;left:4px;right:4px;z-index:1;border-radius:6px;border:1px solid var(--line);
  background:repeating-linear-gradient(135deg,var(--soft) 0 5px,transparent 5px 10px);color:var(--ink2);font-size:12.5px;padding:4px 8px;font-weight:700;overflow:hidden}
.lunch span{background:var(--surface);padding:0 4px;border-radius:3px}

/* ---------- lista ---------- */
.lst{margin-bottom:40px}
.hgroup{display:grid;grid-template-columns:64px 1fr;gap:0 14px;margin-top:6px}
.hh{font:700 22px/1 var(--fh);padding-top:16px;color:var(--ink2)}
.rows{display:grid;gap:8px;padding:8px 0}
.row{display:grid;grid-template-columns:96px 1fr minmax(180px,230px);gap:6px 16px;align-items:start;text-align:left;border:0;border-left:6px solid var(--c);border-radius:10px;
  background:color-mix(in srgb,var(--c) 11%,var(--surface));padding:10px 14px;width:100%;box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 22%,transparent)}
.row:hover{background:color-mix(in srgb,var(--c) 20%,var(--surface))}
.rt{font:700 17px/1.1 var(--fh)}
.rt small{display:block;font:400 13px var(--fb);color:var(--ink2);margin-top:3px}
.rtitle{font-weight:700;font-size:18px;line-height:1.2;display:block}
.rdesc{display:block;color:var(--ink2);font-size:15px;margin-top:2px}
.rppl{display:block;color:var(--ink2);font-size:15px;margin-top:3px}
.rr{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.rm{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:15px}
.rm b{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:700 11px var(--fh);flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;border-radius:999px;padding:1px 9px 1px 6px;background:color-mix(in srgb,var(--c) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.tag i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tag.plain{background:transparent;border-color:var(--line);font-weight:400;color:var(--ink2)}
.row.award{background:var(--gold);border-left-color:var(--gold-ink);color:var(--gold-ink);box-shadow:none}
.row.award .rt small,.row.award .rdesc,.row.award .rm{color:#4F3D00}
.row.award .rm b{background:var(--gold-ink);color:var(--gold)}
.lunchnote{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin:10px 0 16px;color:var(--ink2);font-size:15px}
.lunchnote b{color:var(--ink)}

/* ---------- por tema ---------- */
.ths{display:grid;gap:26px;margin-bottom:40px}
.th h2{display:flex;align-items:center;gap:12px;font:700 22px/1.15 var(--fh);padding:10px 0 8px;border-bottom:3px solid var(--c)}
.th h2 .sw{width:22px;height:22px;border-radius:6px;background:var(--c);flex:none}
.th h2 small{font:400 15px var(--fb);color:var(--ink2);margin-left:auto}
.th .d{color:var(--ink2);margin:6px 0 4px}
details.relx{margin-top:6px}
details.relx summary{cursor:pointer;color:var(--ink2);padding:4px 0;font-weight:700}
.empty{padding:40px 0;color:var(--ink2);text-align:center}

/* ---------- detalhe ---------- */
dialog{border:0;border-radius:18px;padding:0;max-width:min(680px,94vw);width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,13,19,.55)}
.dh{padding:20px 24px 14px;border-top:8px solid var(--c)}
.dh.award{background:var(--gold);color:var(--gold-ink);border-top-color:var(--gold-ink)}
.dh h2{font:700 22px/1.2 var(--fh);margin:10px 0 6px}
.dmeta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:16px}
.db{padding:6px 24px 22px}
.db dl{margin:0;display:grid;gap:10px}
.db dt{font-weight:700;font-size:14px;color:var(--ink2)}
.db dd{margin:1px 0 0;font-size:16.5px}
.db .desc{margin:6px 0 14px;font-size:17px}
.sim{display:grid;gap:6px;margin-top:14px}
.sim button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:transparent;border-radius:10px;padding:7px 10px}
.sim button i{width:6px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.sim small{color:var(--ink2);display:block}
.xbtn{float:right;border:1.5px solid currentColor;background:transparent;border-radius:999px;padding:4px 14px;font-weight:700}

@media (max-width:820px){
  .row{grid-template-columns:1fr}
  .hgroup{grid-template-columns:1fr}
  .hh{padding-top:10px}
  .rt small{display:inline;margin-left:6px}
  .status{margin-left:0;width:100%}
  .gwrap{max-height:none}
}

/* ---------- impressão a partir da tela ---------- */
@media print{
  .bar,.legend,.key,dialog{display:none!important}
  .mast{background:#fff;color:#000}.mast p{color:#444}
  .day:not([aria-selected="true"]){display:none}
  .gwrap{max-height:none;overflow:visible}
}

/* ---------- modo PDF ---------- */
@page pgrid{size:420mm 297mm;margin:9mm}
@page pdoc{size:210mm 297mm;margin:11mm}
body.print{font-size:15px}
.pa3{page:pgrid;break-after:page;display:flex;flex-direction:column}
.pa4{page:pdoc}
.pa4.brk{break-before:page}
.pgh{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;border-bottom:3px solid var(--ink);padding-bottom:8px;margin-bottom:8px}
.pgh h1{font:700 30px/1 var(--fh)}
.pgh p{color:var(--ink2);font-size:16px;text-align:right}
.pgh .big{font:700 54px/.85 var(--fh);margin-right:14px}
.mini{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;margin-bottom:8px;align-items:center}
.mini .m{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.mini .sw{width:13px;height:13px;border-radius:3px;background:var(--c)}
body.print .gwrap{max-height:none;overflow:visible;border-radius:6px;margin:0;border:1px solid var(--line)}
body.print .gh{position:static}
body.print .ga{position:relative}
.cover{display:grid;grid-template-columns:1.05fr 1fr;gap:34px 46px;align-content:start}
.cover h1{font:700 54px/1.02 var(--fh);letter-spacing:-.02em}
.cover .sub{font-size:22px;color:var(--ink2);margin:10px 0 24px}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:22px}
.stats div b{display:block;font:700 40px/1 var(--fh)}
.stats div span{color:var(--ink2);font-size:15px}
.cover h2{font:700 20px var(--fh);margin:0 0 10px}
.lg{display:grid;gap:7px}
.lg .li{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:start;font-size:15px;border-left:0;padding:2px 0}
.lg .sw{width:20px;height:20px;border-radius:5px;background:var(--c);margin-top:2px}
.lg .li b{font-size:16.5px}
.lg .li span{display:block;color:var(--ink2);font-size:14px}
.lg .li em{font-style:normal;font-family:var(--fh);font-size:13px;color:var(--ink2);white-space:nowrap}
.box{border:1.5px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:18px}
.box.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.box.gold p{margin:3px 0}
.rooms{display:grid;gap:6px;font-size:15.5px}
.rooms .rq{font-weight:700;font-size:15.5px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
.tbl th{font-weight:700;color:var(--ink2)}
.pdoc-h{font:700 24px var(--fh);border-bottom:3px solid var(--ink);padding-bottom:6px;margin:0 0 8px}
.pdoc-h small{font:400 15px var(--fb);color:var(--ink2);margin-left:10px}
body.print .row{break-inside:avoid;grid-template-columns:62px 1fr 150px;padding:5px 10px;gap:3px 12px;box-shadow:none;border:1px solid var(--line);border-left:6px solid var(--c);background:var(--surface)}

body.print .rtitle{font-size:14px}

body.print .rt{font-size:13px}body.print .rt small{display:block;font-size:11px;margin:2px 0 0}
body.print .rm{font-size:12px}body.print .rm b{width:17px;height:17px;font-size:10px}
body.print .tag{font-size:11.5px}
body.print .rows{gap:4px;padding:3px 0}
body.print .hgroup{grid-template-columns:44px 1fr;gap:0 8px}
body.print .hh{font-size:16px;padding-top:9px}
body.print .th h2{font-size:18px}
body.print .ths{gap:14px}
.pgfoot{margin-top:auto;padding-top:6px;color:var(--ink2);font-size:12.5px}

/* ================= utilidades ================= */
const $ = (s, r=document) => r.querySelector(s);
const TH = Object.fromEntries(D.themes.map(t => [t.id, t]));
const ROOM = Object.fromEntries(D.rooms.map(r => [r.id, r]));
const DAY = Object.fromEntries(D.days.map(d => [d.id, d]));
const toMin = t => { const [h,m] = t.split(':'); return +h*60 + +m; };
const fh = t => { const [h,m] = t.split(':'); return m==='00' ? `${+h}h` : `${+h}h${m}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z"/></svg>';
D.sessions.forEach(s => {
  s.sm = toMin(s.start); s.em = toMin(s.end);
  s.approx = s.kind==='show' || s.kind==='award';
  s.color = s.kind==='award' ? 'var(--gold)' : (s.theme && TH[s.theme] ? TH[s.theme].color : '#888');
});
const range = s => s.approx ? fh(s.start) : `${fh(s.start)}–${fh(s.end)}`;
const rangeWords = s => s.approx ? `às ${fh(s.start)}` : `${fh(s.start)} às ${fh(s.end)}`;
const roomName = s => s.room==='palco' ? DAY[s.day].palco : ROOM[s.room].name;
const roomNum = s => ROOM[s.room].n;
const isAct = s => !['lunch','portfolio'].includes(s.kind);
const names = s => s.people.map(p => p[1]).join(', ')
  .replace(/\s*\([^)]*\)/g,'').replace(/\s+,/g,',');
const themeCount = id => D.sessions.filter(s => s.theme===id && s.kind!=='portfolio').length;
const themeDayCount = (id, day) => D.sessions.filter(s => s.theme===id && s.day===day && s.kind!=='portfolio').length;
const actCount = day => D.sessions.filter(s => s.day===day && isAct(s)).length;
const ROOM_BADGE = s => roomNum(s) ? `<b>${roomNum(s)}</b>` : `<b style="font-size:9px">♫</b>`;

/* ================= estado ================= */
const state = { day:'sab', view: matchMedia('(max-width:820px)').matches ? 'list' : 'grid', themes:new Set(), q:'' };
const GS = 8*60+30, GE = 21*60+10;

function relation(s){
  if (!state.themes.size) return 'primary';
  if (state.themes.has(s.theme)) return 'primary';
  if (s.tags.some(t => state.themes.has(t))) return 'related';
  return null;
}
function textMatch(s){
  if (!state.q) return true;
  const h = norm([s.title, s.desc, s.sponsor, s.people.map(p=>p[1]).join(' '), roomName(s)].join(' '));
  return h.includes(norm(state.q.trim()));
}
function matchState(s){
  if (['lunch','award'].includes(s.kind)) return 'primary';
  if (s.kind==='portfolio') return 'primary';
  if (!textMatch(s)) return null;
  return relation(s);
}

/* ================= grade ================= */
function gridHTML(day, ppm, o={}){
  const H = (GE-GS)*ppm;
  const rooms = D.rooms.map(r => r.id==='palco' ? {...r, name:DAY[day].palco} : r);
  const items = D.sessions.filter(s => s.day===day);
  const aw = items.find(s => s.kind==='award');
  let head = `<div class="gh corner" style="min-height:var(--hdr)"></div>`;
  rooms.forEach(r => head += `<div class="gh">${r.n?`<span class="rn">${r.n}</span>`:''}<span>${esc(r.name)}</span></div>`);
  let axis = '';
  for (let m = Math.ceil(GS/60)*60; m <= GE; m += 60) axis += `<span class="hr" style="top:${(m-GS)*ppm}px">${m/60}h</span>`;
  if (aw) axis += `<span class="hr aw" style="top:${(aw.sm-GS)*ppm}px">${fh(aw.start)}</span>`;
  let cols = '';
  rooms.forEach(r => {
    let inner = aw ? `<i class="awl" style="top:${(aw.sm-GS)*ppm}px"></i>` : '';
    items.filter(s => s.room===r.id).forEach(s => inner += cardHTML(s, ppm));
    cols += `<div class="gc" style="height:${H}px">${inner}</div>`;
  });
  const off = (Math.ceil(GS/60)*60 - GS) * ppm;
  return `<div class="gwrap" ${o.print?'':'tabindex="0" role="region" aria-label="Grade de horários por espaço"'}>
    <div class="g" style="--hh:${60*ppm}px;--off:${off}px;--hdr:${o.hdr||56}px;--colmin:${o.colmin||210}px;--axw:${o.axw||50}px">
      ${head}<div class="ga" style="height:${H}px">${axis}</div>${cols}</div></div>`;
}
function cardHTML(s, ppm){
  const top = (s.sm-GS)*ppm, h = (s.em-s.sm)*ppm - 2;
  if (s.kind==='lunch')
    return `<div class="lunch" style="top:${top}px;height:${h}px"><span>Almoço ${fh(s.start)}–${fh(s.end)}</span></div>`;
  const rel = matchState(s);
  const cls = ['card', s.kind==='award'?'award':'', s.kind==='portfolio'?'port':'', rel===null?'dim':'', (rel==='related' && state.themes.size)?'rel':''];
  const fs = 13.5*1.17, avail = h - 8 - 14;
  const maxT = Math.max(1, Math.min(6, Math.floor(avail/fs)));
  const need = Math.max(1, Math.ceil(s.title.length / (window.__cw || 26)));
  const hasP = s.people.length && s.kind!=='award' && s.kind!=='portfolio';
  let showP = false, tl = Math.min(maxT, need), pl = 1;
  if (hasP && need <= maxT - 1) {
    pl = Math.min(3, Math.floor((avail - need*fs)/14.5));
    if (pl >= 1) showP = true;
  }
  if (!showP) tl = maxT;
  if (!showP) cls.push('noppl');
  const dots = s.tags.map(t => `<i class="dot" style="--c:${TH[t].color}" title="Também aborda: ${esc(TH[t].name)}"></i>`).join('');
  const label = s.kind==='award' ? 'Premiação' : (s.kind==='portfolio' ? 'Carreira' : TH[s.theme].short);
  const ppl = showP ? `<span class="ppl" style="--pl:${Math.max(1,Math.min(3,pl))}">${esc(names(s))}</span>` : '';
  const extra = s.kind==='portfolio' ? `<span class="ppl" style="display:-webkit-box">${esc(s.desc)}</span>` : (s.kind==='award' ? `<span class="ppl" style="display:-webkit-box">${esc(s.desc)}</span>` : '');
  return `<button class="${cls.filter(Boolean).join(' ')}" style="--c:${s.color};top:${top}px;height:${h}px;--tl:${tl}" data-id="${s.id}" aria-label="${esc(s.title)}, ${esc(rangeWords(s))}">
    <span class="meta"><b>${range(s)}</b><em>${label}</em></span>
    <span class="ttl">${esc(s.title)}</span>${ppl}${extra}${dots?`<span class="dots">${dots}</span>`:''}</button>`;
}

/* ================= lista ================= */
function rowHTML(s, o={}){
  const th = s.theme && TH[s.theme];
  const rel = o.ignoreFilter ? 'primary' : matchState(s);
  const tags = [];
  if (s.kind==='award') tags.push(`<span class="tag plain">${STAR.replace('<svg','<svg style="width:13px;height:13px"')} Premiação</span>`);
  else if (th) tags.push(`<span class="tag" style="--c:${th.color}"><i></i>${esc(th.short)}</span>`);
  s.tags.forEach(t => tags.push(`<span class="tag plain" style="--c:${TH[t].color}"><i style="background:${TH[t].color}"></i>${esc(TH[t].short)}</span>`));
  if (s.sponsor) tags.push(`<span class="tag plain">Conteúdo ${esc(s.sponsor)}</span>`);
  const when = o.showDay ? `<span class="rt">${esc(DAY[s.day].short)}<small>${rangeWords(s)}</small></span>` : `<span class="rt">${fh(s.start)}<small>${s.approx ? 'início' : 'às '+fh(s.end)}</small></span>`;
  const people = o.full ? s.people.map(p => `<span class="rppl"><b>${esc(p[0])}:</b> ${esc(p[1])}</span>`).join('') : (s.people.length ? `<span class="rppl">${esc(names(s))}</span>` : '');
  return `<button class="row ${s.kind==='award'?'award':''}" style="--c:${s.color}" data-id="${s.id}">
    ${when}
    <span><span class="rtitle">${esc(s.title)}</span>${s.desc && o.full!==false ? `<span class="rdesc">${esc(s.desc)}</span>`:''}${people}</span>
    <span class="rr"><span class="rm">${ROOM_BADGE(s)}${esc(roomName(s))}</span><span style="display:flex;flex-wrap:wrap;gap:4px">${tags.join('')}</span></span></button>`;
}
function lunchNote(day){
  const L = D.sessions.filter(s => s.day===day && s.kind==='lunch').map(s => `${esc(roomName(s))} ${fh(s.start)}–${fh(s.end)}`);
  return `<p class="lunchnote"><b>Almoço por espaço:</b> ${L.join('; ')}.</p>`;
}
function listHTML(day, o={}){
  const items = D.sessions.filter(s => s.day===day && s.kind!=='lunch' && (o.ignoreFilter || matchState(s))).sort((a,b) => a.sm-b.sm || a.em-b.em);
  if (!items.length) return `<div class="empty">Nenhuma atividade encontrada com esses filtros.</div>`;
  const groups = {};
  items.forEach(s => (groups[Math.floor(s.sm/60)] ||= []).push(s));
  let h = o.noNote ? '' : lunchNote(day);
  Object.keys(groups).forEach(g => {
    h += `<div class="hgroup"><div class="hh">${g}h</div><div class="rows">${groups[g].map(s => rowHTML(s, o)).join('')}</div></div>`;
  });
  return `<div class="lst">${h}</div>`;
}

/* ================= por tema ================= */
const THEME_DESC = {
  ia:"IA, algoritmos e o futuro do trabalho criativo.",
  mercado:"Agências, holdings, lideranças, modelos de negócio e entidades do setor.",
  marcas:"Branding, collabs, marketing promocional, mídia, influência e publicidade.",
  audiovisual:"Cinema, séries, streaming, produção e narrativa em vídeo.",
  musica:"Artistas, festivais, assinaturas sonoras e os shows dos palcos musicais.",
  design:"Design, tipografia, direção de arte, arquitetura e moda.",
  sociedade:"Diversidade, desigualdades, violência, clima, longevidade e alimentação.",
  saude:"Saúde mental de quem cria e do público.",
  carreira:"Mentorias, portfólio, juniors, creators e carreira internacional.",
  cultura:"Cultura brasileira, humor, literatura, processo criativo e histórias de vida."
};
function themesHTML(o={}){
  const ord = (a,b) => a.day.localeCompare(b.day)*-1 || a.sm-b.sm;   // sab antes de dom
  const order = (a,b) => (a.day===b.day ? a.sm-b.sm : (a.day==='sab'?-1:1));
  let h = '';
  const active = state.themes.size ? D.themes.filter(t => state.themes.has(t.id)) : D.themes;
  active.forEach(t => {
    const prim = D.sessions.filter(s => s.theme===t.id && s.kind!=='portfolio' && (o.ignoreFilter || textMatch(s))).sort(order);
    const rel = D.sessions.filter(s => s.theme!==t.id && s.tags.includes(t.id) && (o.ignoreFilter || textMatch(s))).sort(order);
    if (!prim.length && !rel.length) return;
    const ro = {showDay:true, ignoreFilter:true, full:o.full};
    h += `<section class="th" style="--c:${t.color}"><h2><span class="sw"></span>${esc(t.name)}<small>${prim.length} atividades, Sáb ${themeDayCount(t.id,'sab')} e Dom ${themeDayCount(t.id,'dom')}</small></h2>
      <p class="d">${esc(THEME_DESC[t.id])}</p><div class="rows">${prim.map(s => rowHTML(s, ro)).join('')}</div>
      ${rel.length ? `<details class="relx" ${o.openRel?'open':''}><summary>Também aborda este tema (${rel.length})</summary><div class="rows">${rel.map(s => rowHTML(s, ro)).join('')}</div></details>` : ''}</section>`;
  });
  const awards = D.sessions.filter(s => s.kind==='award');
  if (!state.themes.size) h += `<section class="th" style="--c:var(--gold)"><h2><span class="sw"></span>Cerimônias de Premiação<small>${awards.length} cerimônias</small></h2><div class="rows">${awards.map(s => rowHTML(s,{showDay:true,ignoreFilter:true})).join('')}</div></section>`;
  return `<div class="ths">${h || '<div class="empty">Nenhuma atividade encontrada.</div>'}</div>`;
}

/* ================= faixa de premiação ================= */
function stripHTML(day){
  const a = D.sessions.find(s => s.day===day && s.kind==='award');
  return `<button class="strip" data-id="${a.id}">${STAR}<b>${fh(a.start)} – Cerimônia de Premiação</b><span>${esc(a.desc)} Local: ${esc(roomName(a))}.</span></button>`;
}

/* ================= tela principal ================= */
function shell(){
  $('#root').innerHTML = `
  <header class="mast"><div class="mast-in">
    <div><h1>Festival do Clube de Criação</h1><p>Programação de 17 e 18 de outubro de 2026</p></div>
    <div class="days" role="tablist" aria-label="Dia">${D.days.map(d => `
      <button class="day" role="tab" data-day="${d.id}" aria-selected="false"><span class="num">${d.num}</span><span class="wd">${d.wd}</span><span class="cnt">${actCount(d.id)} atividades</span></button>`).join('')}</div>
  </div></header>
  <div class="wrap">
    <div class="bar">
      <div class="views" role="group" aria-label="Modo de visualização">
        <button data-view="grid" aria-pressed="false">Grade</button><button data-view="list" aria-pressed="false">Lista</button><button data-view="theme" aria-pressed="false">Por tema</button>
      </div>
      <input class="search" type="search" id="q" placeholder="Buscar título, pessoa ou empresa" aria-label="Buscar">
      <span class="status" id="status" aria-live="polite"></span>
    </div>
    <div class="legend" id="legend" aria-label="Legenda de temas, clique para filtrar"></div>
    <div class="key">
      <span><i class="k-bar"></i>Barra colorida: tema principal</span>
      <span><i class="k-dot"></i>Pontos: temas relacionados</span>
      <span><i class="k-gold"></i>Premiação</span>
      <span><i class="k-hatch"></i>Almoço</span>
    </div>
    <div id="strip"></div>
    <main id="app"></main>
  </div>`;
  $('#legend').innerHTML = D.themes.map(t => `<button class="chip" style="--c:${t.color}" data-theme="${t.id}" aria-pressed="false" title="${esc(THEME_DESC[t.id])}"><span class="sw"></span>${esc(t.name)}<small>${themeCount(t.id)}</small></button>`).join('')
    + `<button class="clear" id="clear" hidden>Limpar filtros</button>`;
}
function render(){
  document.querySelectorAll('.day').forEach(b => b.setAttribute('aria-selected', b.dataset.day===state.day));
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view===state.view));
  document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', state.themes.has(b.dataset.theme)));
  $('#clear').hidden = !(state.themes.size || state.q);
  const app = $('#app');
  $('#strip').innerHTML = state.view==='theme' ? '' : stripHTML(state.day);
  if (state.view==='grid') app.innerHTML = gridHTML(state.day, 1.35);
  else if (state.view==='list') app.innerHTML = listHTML(state.day);
  else app.innerHTML = themesHTML();
  const pool = state.view==='theme' ? D.sessions : D.sessions.filter(s => s.day===state.day);
  const acts = pool.filter(s => isAct(s) && s.kind!=='award');
  const shown = acts.filter(s => matchState(s)==='primary' || matchState(s)==='related');
  $('#status').textContent = (state.themes.size || state.q) ? `${shown.length} de ${acts.length} atividades correspondem` : '';
}
function openDlg(id){
  const s = D.sessions.find(x => x.id===id); if(!s) return;
  const th = s.theme && TH[s.theme];
  const sim = D.sessions.filter(o => o.day===s.day && o.id!==s.id && isAct(o) && o.kind!=='award' && s.kind!=='award' && o.sm < s.em && o.em > s.sm).sort((a,b)=>a.sm-b.sm);
  const tags = [];
  if (th && s.kind!=='award') tags.push(`<span class="tag" style="--c:${th.color}"><i></i>${esc(th.name)}</span>`);
  s.tags.forEach(t => tags.push(`<span class="tag plain"><i style="background:${TH[t].color}"></i>Também: ${esc(TH[t].name)}</span>`));
  if (s.kind==='award') tags.push(`<span class="tag plain" style="border-color:currentColor;color:inherit">Premiação</span>`);
  const dl = [];
  s.people.forEach(p => dl.push(`<div><dt>${esc(p[0])}</dt><dd>${esc(p[1])}</dd></div>`));
  if (s.sponsor) dl.push(`<div><dt>Conteúdo de parceiro</dt><dd>${esc(s.sponsor)}</dd></div>`);
  $('#dlg').innerHTML = `
    <div class="dh ${s.kind==='award'?'award':''}" style="--c:${s.color}">
      <button class="xbtn" id="x" aria-label="Fechar">Fechar</button>
      <div class="dmeta"><b>${esc(DAY[s.day].full)}</b><span>${esc(rangeWords(s))}${s.approx?' (término não informado)':''}</span></div>
      <h2 id="dlgt">${esc(s.title)}</h2>
      <div class="dmeta"><span class="rm" style="display:inline-flex;gap:7px;align-items:center;font-weight:700">${s.kind==='award'?'':''}${roomNum(s)?`<span style="width:22px;height:22px;border-radius:50%;background:currentColor;display:inline-grid;place-items:center"><span style="color:${s.kind==='award'?'var(--gold)':'var(--surface)'};font:700 12px var(--fh)">${roomNum(s)}</span></span>`:''}${esc(roomName(s))}</span><span>Formato: ${esc(s.fmt)}</span></div>
    </div>
    <div class="db">
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px">${tags.join('')}</div>
      ${s.desc ? `<p class="desc">${esc(s.desc)}</p>` : ''}
      <dl>${dl.join('')}</dl>
      ${sim.length ? `<div class="sim"><b style="margin-top:6px">Acontece ao mesmo tempo</b>${sim.map(o => `<button data-id="${o.id}" style="--c:${o.color}"><i></i><span><b>${esc(o.title)}</b><small>${esc(range(o))}, ${esc(roomName(o))}</small></span></button>`).join('')}</div>` : ''}
    </div>`;
  const dlg = $('#dlg'); if(!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
}

/* ================= PDF (modo #print) ================= */
function printMode(){
  document.body.classList.add('print');
  const totalSessions = D.sessions.filter(s => ['session','opening'].includes(s.kind)).length;
  const shows = D.sessions.filter(s => s.kind==='show').length;
  const awards = D.sessions.filter(s => s.kind==='award');
  const lunchRows = D.rooms.filter(r => r.id!=='oliver' && r.id!=='palco').map(r => {
    const f = d => { const l = D.sessions.find(s => s.day===d && s.room===r.id && s.kind==='lunch'); return l ? `${fh(l.start)}–${fh(l.end)}` : '–'; };
    return `<tr><td>(${r.n}) ${esc(r.name)}</td><td>${f('sab')}</td><td>${f('dom')}</td></tr>`;
  }).join('');
  const cover = `<section class="pa3"><div class="cover">
    <div>
      <h1>Festival do Clube de Criação</h1>
      <p class="sub">Guia de programação, sábado 17 e domingo 18 de outubro de 2026</p>
      <div class="stats">
        <div><b>${totalSessions}</b><span>painéis, conversas, mentorias e workshops</span></div>
        <div><b>${shows}</b><span>shows nos palcos musicais</span></div>
        <div><b>${awards.length}</b><span>cerimônias de premiação</span></div>
      </div>
      <div class="box gold"><h2 style="display:flex;gap:8px;align-items:center"><span style="width:22px;height:22px;display:inline-block">${STAR}</span>Cerimônias de Premiação</h2>
        ${awards.map(a => `<p><b>${esc(DAY[a.day].full)}, ${fh(a.start)}.</b> ${esc(a.desc)} Local: ${esc(roomName(a))}.</p>`).join('')}</div>
      <h2>Espaços</h2>
      <div class="rooms box">${D.rooms.map(r => `<div class="rq" style="display:flex;gap:10px;align-items:center">${r.n?`<b style="width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 12px var(--fh)">${r.n}</b>`:`<b style="width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 11px var(--fh)">♫</b>`}<span>${r.id==='palco' ? `Palco Musical Jamute (sábado) e Palco Musical Antfood (domingo)` : esc(r.name)}${r.id==='oliver' ? ', aberta das 9h às 18h nos dois dias; agendamento no local, o mais cedo possível' : ''}</span></div>`).join('')}</div>
      <h2>Horários de almoço</h2>
      <table class="tbl"><tr><th>Espaço</th><th>Sábado</th><th>Domingo</th></tr>${lunchRows}</table>
    </div>
    <div>
      <h2>Legenda de temas</h2>
      <div class="lg">${D.themes.map(t => `<div class="li" style="--c:${t.color}"><span class="sw"></span><div><b>${esc(t.name)}</b><span>${esc(THEME_DESC[t.id])}</span></div><em>Sáb ${themeDayCount(t.id,'sab')} / Dom ${themeDayCount(t.id,'dom')}</em></div>`).join('')}</div>
      <h2 style="margin-top:22px">Como ler a grade</h2>
      <div class="box" style="font-size:15px;display:grid;gap:7px">
        <div><b style="display:inline-block;width:5px;height:16px;background:var(--ink2);border-radius:2px;vertical-align:-3px;margin-right:8px"></b>A barra colorida à esquerda do cartão indica o tema principal; o nome do tema aparece no canto superior direito.</div>
        <div><i class="dot" style="--c:var(--ink2);display:inline-block;margin-right:8px"></i>Pontos coloridos no canto inferior direito indicam temas relacionados.</div>
        <div><i class="k-gold" style="display:inline-block;vertical-align:-3px;margin-right:8px"></i>Dourado: Cerimônia de Premiação. A linha dourada tracejada cruza todos os espaços às 20h30.</div>
        <div><i class="k-hatch" style="display:inline-block;vertical-align:-3px;margin-right:8px"></i>Hachurado: pausa para almoço (o horário muda por espaço).</div>
        <div>Sessões com “Conteúdo” e o nome da empresa são conteúdos de parceiros. Horário só com início (shows e cerimônias): a programação não informa o término.</div>
      </div>
    </div></div></section>`;
  const legendMini = `<div class="mini">${D.themes.map(t => `<span class="m" style="--c:${t.color}"><i class="sw"></i>${esc(t.name)}</span>`).join('')}<span class="m"><i class="sw" style="background:var(--gold)"></i>Premiação</span></div>`;
  const grids = D.days.map(d => `<section class="pa3">
    <div class="pgh"><div style="display:flex;align-items:flex-end"><span class="big">${d.num}</span><h1>${d.full}</h1></div><p>Festival do Clube de Criação 2026, ${actCount(d.id)} atividades<br>Premiação às 20h30 no Auditório Papaki</p></div>
    ${legendMini}${gridHTML(d.id, 1.12, {print:true, hdr:44, colmin:200, axw:46})}</section>`).join('');
  const lists = D.days.map((d,i) => `<section class="pa4 ${i? 'brk':''}"><h2 class="pdoc-h">${d.full}<small>programação completa por horário</small></h2>${listHTML(d.id,{full:true, ignoreFilter:true})}</section>`).join('');
  const themes = `<section class="pa4 brk"><h2 class="pdoc-h">Programação por tema<small>sábado e domingo juntos</small></h2>${themesHTML({ignoreFilter:true, openRel:true, full:false})}</section>`;
  $('#root').innerHTML = cover + grids + lists + themes;
  document.querySelectorAll('details').forEach(d => d.open = true);
}

/* ================= eventos ================= */
function init(){
  if (location.hash === '#print') return printMode();
  shell();
  document.addEventListener('click', e => {
    const day = e.target.closest('.day'); if (day){ state.day = day.dataset.day; return render(); }
    const v = e.target.closest('[data-view]'); if (v){ state.view = v.dataset.view; return render(); }
    const c = e.target.closest('.chip'); if (c){ const t=c.dataset.theme; state.themes.has(t)?state.themes.delete(t):state.themes.add(t); return render(); }
    if (e.target.closest('#clear')){ state.themes.clear(); state.q=''; $('#q').value=''; return render(); }
    if (e.target.closest('#x')) return $('#dlg').close();
    const id = e.target.closest('[data-id]'); if (id){ return openDlg(id.dataset.id); }
    if (e.target === $('#dlg')) $('#dlg').close();
  });
  $('#q').addEventListener('input', e => { state.q = e.target.value; render(); });
  render();
}
init();
</script>
</body>
</html>
